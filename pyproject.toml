[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakebase-accelerator"
version = "1.0.0"
description = "Backend API for the Zeb Agentic Lakebase Accelerator"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "psycopg2-binary==2.9.10",
    "databricks-sdk==0.52.0",
    "jinja2==3.1.5",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "sse-starlette==2.2.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "langgraph==0.4.8",
    "langchain-core==0.3.49",
    "langchain-openai==0.3.12",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "hypothesis==6.119.3",
    "ruff==0.8.6",
    "coverage==7.6.10",
    "diff-cover==9.2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakebase_accelerator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lakebase_accelerator"]

[tool.coverage.run]
source = ["src/lakebase_accelerator"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
