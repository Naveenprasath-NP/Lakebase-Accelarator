command:
  - "bash"
  - "-c"
  - "uv sync --all-extras && uv run uvicorn lakebase_accelerator.main:app --host 0.0.0.0 --port 8000"

env:
  # ─── Python Path (CRITICAL for src/ layout) ─────────────────────
  - name: "PYTHONPATH"
    value: "/app/python/source_code/src"

  # ─── Databricks Workspace ────────────────────────────────────────
  - name: "DATABRICKS_HOST"
    value-from: "lakebase-accelerator.databricks-host"
  - name: "DATABRICKS_CLIENT_ID"
    value-from: "lakebase-accelerator.databricks-client-id"
  - name: "DATABRICKS_CLIENT_SECRET"
    value-from: "lakebase-accelerator.databricks-client-secret"

  # ─── Model Serving ──────────────────────────────────────────────
  - name: "MODEL_SERVING_ENDPOINT"
    value-from: "lakebase-accelerator.model-serving-endpoint"

  # ─── Lakebase / Postgres ────────────────────────────────────────
  - name: "POSTGRES_HOST"
    value-from: "lakebase-accelerator.postgres-host"
  - name: "POSTGRES_PORT"
    value-from: "lakebase-accelerator.postgres-port"
  - name: "POSTGRES_USER"
    value-from: "lakebase-accelerator.postgres-user"
  - name: "POSTGRES_DB"
    value-from: "lakebase-accelerator.postgres-db"
  - name: "POSTGRES_SCHEMA"
    value-from: "lakebase-accelerator.postgres-schema"
  - name: "LAKEBASE_ENDPOINT_NAME"
    value-from: "lakebase-accelerator.lakebase-endpoint-name"

  # ─── Application ────────────────────────────────────────────────
  - name: "APP_NAME"
    value-from: "lakebase-accelerator.app-name"
  - name: "CATALOG_NAME"
    value-from: "lakebase-accelerator.catalog-name"
  - name: "DATABRICKS_CATALOG"
    value-from: "lakebase-accelerator.databricks-catalog"
  - name: "DATABRICKS_SCHEMA"
    value-from: "lakebase-accelerator.databricks-schema"

  # ─── Volume Storage (Brownfield) ────────────────────────────────
  - name: "VOLUME_CATALOG"
    value-from: "lakebase-accelerator.volume-catalog"
  - name: "VOLUME_SCHEMA"
    value-from: "lakebase-accelerator.volume-schema"
  - name: "VOLUME_NAME"
    value-from: "lakebase-accelerator.volume-name"

  # ─── MLflow ─────────────────────────────────────────────────────
  - name: "MLFLOW_ENABLE_DB_SDK"
    value: "true"

  # ─── Frontend Build (Databricks Job) ───────────────────────────
  - name: "FRONTEND_BUILD_USE_SERVERLESS"
    value: "true"
  - name: "FRONTEND_BUILD_NODE_TYPE"
    value: "i3.xlarge"
  - name: "FRONTEND_BUILD_SPARK_VERSION"
    value: "14.3.x-scala2.12"
  - name: "FRONTEND_BUILD_TIMEOUT_SECONDS"
    value: "300"
