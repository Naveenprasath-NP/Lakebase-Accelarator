command:
  - bash
  - -c
  - "uv sync --all-extras && uv run uvicorn lakebase_accelerator.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300"

env:
  - name: PYTHONPATH
    value: "/app/python/source_code/src"
  - name: DATABRICKS_HOST
    valueFrom: databricks_host
  - name: DATABRICKS_CLIENT_ID
    valueFrom: databricks_client_id
  - name: DATABRICKS_CLIENT_SECRET
    valueFrom: databricks_client_secret
  - name: MODEL_SERVING_ENDPOINT
    valueFrom: model_serving_endpoint
  - name: POSTGRES_HOST
    valueFrom: postgres_host
  - name: POSTGRES_PORT
    valueFrom: postgres_port
  - name: POSTGRES_USER
    valueFrom: postgres_user
  - name: POSTGRES_DB
    valueFrom: postgres_db
  - name: POSTGRES_SCHEMA
    valueFrom: postgres_schema
  - name: LAKEBASE_ENDPOINT_NAME
    valueFrom: lakebase_endpoint_name
  - name: APP_NAME
    valueFrom: app_name
  - name: CATALOG_NAME
    valueFrom: catalog_name
  - name: DATABRICKS_CATALOG
    valueFrom: databricks_catalog
  - name: DATABRICKS_SCHEMA
    valueFrom: databricks_schema
  - name: VOLUME_CATALOG
    valueFrom: volume_catalog
  - name: VOLUME_SCHEMA
    valueFrom: volume_schema
  - name: VOLUME_NAME
    valueFrom: volume_name
  - name: MLFLOW_ENABLE_DB_SDK
    value: "true"
  - name: FRONTEND_BUILD_USE_SERVERLESS
    value: "true"
  - name: FRONTEND_BUILD_NODE_TYPE
    value: "i3.xlarge"
  - name: FRONTEND_BUILD_SPARK_VERSION
    value: "14.3.x-scala2.12"
  - name: FRONTEND_BUILD_TIMEOUT_SECONDS
    value: "300"
